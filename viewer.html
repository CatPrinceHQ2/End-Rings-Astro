<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>End-Ring Reconstruction — full res</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0a0a0f; }
  #viewer { width:100%; height:100vh; }
</style>
</head>
<body>
<div id="viewer"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/openseadragon.min.js"></script>
<script>
  OpenSeadragon({
    id: "viewer",
    prefixUrl: "https://cdnjs.cloudflare.com/ajax/libs/openseadragon/4.1.1/images/",
    tileSources: "tiles128.dzi",
    showNavigator: true,
    minZoomImageRatio: 0.05,
    maxZoomPixelRatio: 4
  });
</script>
</body>
</html>
